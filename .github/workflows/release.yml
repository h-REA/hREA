name: Release

on:
  push:
    tags:
      - 'happ-[0-9]+.[0-9]+.[0-9]+**'

# on:
#   push:
#     branches: [ sprout ]
#   pull_request:
#     branches: [ sprout ]


jobs:
  # the create-release would be used once we want to create a specific release based on if the commit has a tag
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # per https://github.com/taiki-e/create-gh-release-action/blob/f8e035329c036c64d0ac5edc2852fffa67d7d6f4/action.yml#L19
          prefix: happ
        env:
          # (required)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    # `upload bundles` calls `gh release upload`, which needs the release to
    # already exist. Without this the two jobs start together and the upload
    # races the creation. It has worked so far only because create-release
    # takes seconds and this job takes the better part of an hour, which is a
    # timing accident, not a guarantee.
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source code
        uses: actions/checkout@v3
      # this should be with Cargo.lock files
      # technically, but this repo doesn't have them checked in to git
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo/bin/
            .cargo/registry/index/
            .cargo/registry/cache/
            .cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Use Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = flakes nix-command
            substituters = https://cache.nixos.org https://cache.holo.host https://ci-builds.cachix.org https://holochain-ci.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.holo.host-1:lNXIXtJgS9Iuw4Cu6X0HINLu9sTfcjEntnrgwMQIMcE= cache.holo.host-2:ZJCkX3AUYZ8soxTLfTb60g+F3MkWD7hkH9y8CgqwhDQ= ci-builds.cachix.org-1:fxB0+h/MMlCpXf6hFsQM31YpHbaQoRmcNPNHwDUkXA4= holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8=
      - uses: cachix/cachix-action@v12
        with:
          name: ci-builds
          authToken: "${{ secrets.CACHIX_TOKEN }}"
      - name: Prepare Nix environment
        run: nix develop --command bash -c "echo Completed"
      - name: Install PNPM and dependencies
        run: nix develop --command bash -c "yarn install --no-frozen-lockfile"
      - name: Build WASM, dna, happ
        run: nix develop --command bash -c 'yarn run build:happ'
      # - name: Build explorer UI and webhapp package
      #   run: nix develop --command bash -c 'pnpm run build:webhapp'
      - name: upload bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          test -f workdir/hrea.happ || { echo "workdir/hrea.happ missing after build:happ"; exit 1; }
          test -f dnas/hrea/workdir/hrea.dna || { echo "dnas/hrea/workdir/hrea.dna missing after build:happ"; exit 1; }
          gh release upload "$TAG" "workdir/hrea.happ" --clobber
          gh release upload "$TAG" "dnas/hrea/workdir/hrea.dna" --clobber
        # gh release upload "${GITHUB_REF#refs/tags/}" "bundles/web-app/hrea.webhapp" --clobber
