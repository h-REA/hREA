[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"

[workspace]
members = ["dnas/*/zomes/coordinator/*", "dnas/*/zomes/integrity/*"]
resolver = "2"

[workspace.dependencies]
hdi = "=0.6.0"
hdk = "=0.5.0"
holochain_serialized_bytes = "0.0.56"
serde = "1.0"

[workspace.dependencies.hrea]
path = "dnas/hrea/zomes/coordinator/hrea"

[workspace.dependencies.hrea_integrity]
path = "dnas/hrea/zomes/integrity/hrea"