[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"

[workspace]
members = ["dnas/*/zomes/coordinator/*", "dnas/*/zomes/integrity/*"]
# tests/sweettest builds for the host and depends on the full conductor. Keeping
# it out of this workspace means `cargo build --target wasm32-unknown-unknown`
# (yarn build:zomes) never tries to compile Holochain for wasm.
exclude = ["tests/sweettest"]
resolver = "2"

[workspace.dependencies]
hdi = "=0.7.1"
hdk = "=0.6.1"
holochain_serialized_bytes = "=0.0.57"
serde = "1.0"
rand = "0.9"

[workspace.dependencies.hrea]
path = "dnas/hrea/zomes/coordinator/hrea"

[workspace.dependencies.hrea_integrity]
path = "dnas/hrea/zomes/integrity/hrea"